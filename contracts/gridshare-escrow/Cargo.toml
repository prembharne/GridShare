[package]
name = "gridshare-escrow"
version = "0.1.0"
edition = "2021"
description = "GridShare EV Charging Escrow - vault-grade Soroban contract"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "21.0.0"

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
debug = false
panic = "abort"
codegen-units = 1
lto = true
overflow-checks = true
